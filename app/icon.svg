<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    A single beam falling on a pool of light.

    Everything here is sized so it survives 16x16, which is the only size that
    really matters: the fixture becomes a two-pixel cap, the beam a wedge, the
    pool a bright bar. No outlines, no detail, one hue against the house black —
    at favicon scale a second colour just turns to mud.
  -->
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC46B" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#FFA53D" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FFA53D" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD08A" stop-opacity="1"/>
      <stop offset="60%" stop-color="#FFA53D" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFA53D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="#08080A"/>

  <!-- the beam, widening downstage -->
  <path d="M26 17 H38 L49 45 H15 Z" fill="url(#beam)"/>

  <!-- the fixture it comes out of -->
  <rect x="24" y="9" width="16" height="8" rx="2.5" fill="#FFC46B"/>

  <!-- the pool it lands in -->
  <ellipse cx="32" cy="46" rx="21" ry="6.5" fill="url(#pool)"/>
  <ellipse cx="32" cy="46" rx="11" ry="3" fill="#FFDCAC"/>
</svg>
